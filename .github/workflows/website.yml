name: Website

# Builds the Onix website (website/ + the launcher's sunken scene, launcher/src/js/fall.js and skin3d.js) and pushes it
# to the branch gh-pages. GitHub Pages serves that branch (Settings → Pages → Deploy from a branch → gh-pages, / (root)).
on:
  push:
    paths: ['website/**', 'tools/build_website.py', 'mod-1.21.11/src/main/resources/assets/onix/lang_onix/de.json', 'launcher/src/js/fall.js', 'launcher/src/js/skin3d.js', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website
  cancel-in-progress: true

env:
  # the Minecraft player whose skin the falling figure on the start page wears
  SITE_SKIN: carbon2834

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the site
        run: |
          python3 tools/build_website.py
          mkdir -p site
          cp -r website/. site/
          rm -rf site/src site/data
          mkdir -p site/js
          cp launcher/src/js/fall.js launcher/src/js/skin3d.js site/js/
          touch site/.nojekyll

      - name: The figure's skin (Minecraft player ${{ env.SITE_SKIN }})
        continue-on-error: true
        run: |
          # the skin and whether it is the slim (Alex) model: Mojang's public profile API (with retries, it limits
          # shared CI addresses), then playerdb.co, then mc-heads.net (no model information there)
          get() { for i in 1 2 3 4; do curl -fsSL -m 20 "$1" && return 0; sleep $((i * 5)); done; return 1; }
          url=""; model=classic
          if uuid=$(get "https://api.mojang.com/users/profiles/minecraft/$SITE_SKIN" | jq -er .id) &&
             tex=$(get "https://sessionserver.mojang.com/session/minecraft/profile/$uuid" | jq -er '.properties[] | select(.name=="textures") | .value' | base64 -d); then
            url=$(echo "$tex" | jq -r .textures.SKIN.url)
            model=$(echo "$tex" | jq -r '.textures.SKIN.metadata.model // "classic"')
          elif pdb=$(get "https://playerdb.co/api/player/minecraft/$SITE_SKIN"); then
            uuid=$(echo "$pdb" | jq -r .data.player.raw_id)
            tex=$(echo "$pdb" | jq -r '.data.player.properties[]? | select(.name=="textures") | .value' | base64 -d 2>/dev/null || true)
            url=$(echo "$tex" | jq -r '.textures.SKIN.url // empty' 2>/dev/null || true)
            model=$(echo "$tex" | jq -r '.textures.SKIN.metadata.model // "classic"' 2>/dev/null || echo classic)
            [ -n "$url" ] || url=$(echo "$pdb" | jq -r '.data.player.skin_texture // empty')
          fi
          [ -n "$url" ] || url="https://mc-heads.net/skin/$SITE_SKIN"
          echo "skin: $url ($model)"
          get "$url" > site/img/skin.png
          file site/img/skin.png
          printf '{"name": "%s", "slim": %s}\n' "$SITE_SKIN" "$([ "$model" = slim ] && echo true || echo false)" > site/img/skin.json
          cat site/img/skin.json
          ls -R site | head -40

      - name: Push to gh-pages
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Website of ${GITHUB_SHA::8}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
