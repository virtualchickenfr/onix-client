name: Deploy Onix server

# Puts the Onix server (server/cloudflare) on Cloudflare Workers with a D1 database – free tier.
# Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (README → Onix server on Cloudflare).
# Runs when the server or the shop prices change, or by hand (Actions → Deploy Onix server → Run workflow).

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        working-directory: server/cloudflare
        run: node test.mjs
      - name: Deploy (only with API token secrets; normally Cloudflare deploys by itself)
        working-directory: server/cloudflare
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Onix server::Not deployed – add the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID first."
            exit 0
          fi
          W="npx --yes wrangler@4"
          # the database: find it, or create it the first time
          id=$($W d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s);const d=l.find(x=>x.name==='onix');process.stdout.write(d?d.uuid:'')})")
          if [ -z "$id" ]; then
            $W d1 create onix
            id=$($W d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s);process.stdout.write(l.find(x=>x.name==='onix').uuid)})")
          fi
          sed -i "s/DATABASE_ID/$id/" wrangler.toml
          $W d1 execute onix --remote --file schema.sql
          $W deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n 1)
          if [ -z "$url" ]; then
            echo "::error title=Onix server::No workers.dev address – open Workers & Pages in the Cloudflare dashboard once to create your workers.dev subdomain, then run this again."
            exit 1
          fi
          curl -fsS "$url/v1/hello"
          echo "::notice title=Onix server URL::$url"
          echo "### Onix server: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the live server (Cloudflare builds it from this commit)
        shell: bash
        run: |
          for i in $(seq 1 20); do
            hello=$(curl -fsS https://mconixclient.virtualchickenfr.workers.dev/v1/hello || true)
            if echo "$hello" | grep -q '"version":3'; then break; fi
            sleep 15
          done
          echo "::notice title=Live server::$hello"
