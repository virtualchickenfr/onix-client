name: Essential probe
# Development helper: downloads the Essential mod (Fabric, 1.21.11) and lists how it adds its main menu buttons,
# so Onix's own title screen can show them too. Run by hand (Actions → Essential probe).
on:
  workflow_dispatch:
  push:
    paths: ['.github/essential-probe-trigger']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Performance mods for 1.21.11
        run: |
          for p in sodium lithium ferrite-core immediatelyfast entityculling modernfix badoptimizations scalablelux moreculling c2me-fabric krypton noisium; do
            v=$(curl -s "https://api.modrinth.com/v2/project/$p/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%221.21.11%22%5D" | jq -r '[.[] | select(.version_type=="release")][0] | (.version_number // "none") + " deps=" + ([.dependencies[]? | select(.dependency_type=="required") | .project_id] | join(","))')
            echo "$p: $v"
          done
