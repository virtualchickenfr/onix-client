name: Essential probe
# Development helper: downloads the Essential mod (Fabric, 1.21.11) and lists how it adds its main menu buttons,
# so Onix's own title screen can show them too. Run by hand (Actions → Essential probe).
on:
  workflow_dispatch:
  push:
    paths: ['.github/essential-probe-trigger']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download and inspect
        run: |
          set -e
          url=$(curl -s 'https://api.modrinth.com/v2/project/essential/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%221.21.11%22%5D' | jq -r '.[0].files[0].url')
          echo "jar: $url"
          curl -sL "$url" -o essential.jar
          mkdir x && cd x && unzip -q ../essential.jar
          for j in $(find . -name '*.jar'); do mkdir -p "n/$(basename $j)"; (cd "n/$(basename $j)" && unzip -qo "../../$j" || true); done
          E=$(ls -d n/essential-*.jar | grep -v loader | head -1)
          cd "$E"
          echo "== classes that use the title screen (class_442)"
          grep -rl --include='*.class' 'class_442' . | head -40
          echo "== mixins on the title screen"
          grep -o '"[^"]*TitleScreen[^"]*"' mixins.essential.json mixins.essential.refmap.json | sort -u | head -20
          echo "== GuiUtil / EssentialAPI / InitMainMenuEvent"
          javap -p -cp . gg.essential.api.utils.GuiUtil | head -40
          javap -p -cp . gg.essential.event.essential.InitMainMenuEvent | head -20
          for c in $(grep -rl --include='*.class' 'class_442' . | head -12); do echo "--- $c"; javap -c -p -cp . "$(echo ${c#./} | sed 's/\.class$//; s#/#.#g')" 2>/dev/null | grep -n 'class_442' | head -6; done
