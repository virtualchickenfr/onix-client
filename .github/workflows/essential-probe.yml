name: Essential probe
# Development helper for fetches the sandbox cannot make (here: the MCTiers API used by the Tier Tagger module).
on:
  workflow_dispatch:
  push:
    paths: ['.github/essential-probe-trigger']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: MCTiers API
        run: |
          for u in "https://mctiers.com/api/v2/mode/list" "https://mctiers.com/api/v2/profile/by-name/Marlowww" "https://mctiers.com/api/profile/by-name/Marlowww" "https://mctiers.com/api/search_profile/Marlowww" "https://mctiers.com/api/v2/overall?count=3" "https://mctiers.com/api/rankings/sword?count=2"; do
            echo "=== $u"; curl -s -m 20 -w "\nHTTP %{http_code}\n" "$u" | head -c 1500; echo
          done
      - name: TierTagger reference (API use only)
        run: |
          git clone -q --depth 1 https://github.com/uku3lig/tiertagger tt || exit 0
          grep -rhoE "https?://[a-zA-Z0-9./_{}%-]+" tt --include=*.java --include=*.kt | sort -u | head -30
          grep -rn "pos\b\|peak" tt --include=*.java | head -20
