name: Minecraft sources (for development)
# Decompiles Minecraft for each mod build and pushes the sources to the branch mc-sources-<version>,
# so APIs can be looked up without a local Gradle setup.
on:
  push:
    paths: ['.github/mc-sources-trigger']
permissions:
  contents: write
jobs:
  sources:
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: mod
            java: 21
          - dir: mod-1.21.11
            java: 25
          - dir: ports/build/mod-1.21.10
            port: '1.21.10'
            java: 25
          - dir: ports/build/mod-1.21.9
            port: '1.21.9'
            java: 25
          - dir: ports/build/mod-1.21.8
            port: '1.21.8'
            java: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Generate port
        if: matrix.port
        run: python3 tools/port.py ${{ matrix.port }}
      - name: Decompile
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew genSources --no-daemon --console=plain > gen.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            grep -E "FAILURE|What went wrong|error|Error|wrong:|> " gen.log | head -n 40 | while IFS= read -r l; do echo "::error::$l"; done
            exit "$status"
          fi
          find ~/.gradle .gradle build -name '*.jar' 2>/dev/null | grep -i -E 'minecraft|sources' | head -n 40 | while IFS= read -r l; do echo "::notice::$l"; done
      - name: Push sources
        shell: bash
        run: |
          ver=$(grep '^minecraft_version=' ${{ matrix.dir }}/gradle.properties | cut -d= -f2)
          jar=$(find ~/.gradle ${{ matrix.dir }}/.gradle -name '*-sources.jar' 2>/dev/null | grep -i minecraft | grep -v -i fabric-api | head -n 1)
          jar=$(realpath "$jar")
          echo "::notice::sources jar: $jar"
          test -n "$jar"
          mkdir -p /tmp/out && cd /tmp/out && unzip -q "$jar" -x 'META-INF/*'
          git init -q -b "mc-sources-$ver" && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "Minecraft $ver sources ($(basename "$jar"))"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/mc-sources-$ver"
          echo "::notice::pushed mc-sources-$ver"
