name: Remap Onix sources to Mojang names (for development)
on:
  push:
    paths: ['.github/migrate-trigger']
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Remap
        working-directory: mod
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew migrateMappings --mappings "net.minecraft:mappings:1.21.1" --no-daemon --console=plain > migrate.log 2>&1
          status=$?
          set -e
          tail -n 30 migrate.log | while IFS= read -r l; do echo "::notice::$l"; done
          exit "$status"
      - name: Push remapped sources
        shell: bash
        run: |
          out=$(realpath mod/remappedSrc)
          echo "::notice::files: $(find "$out" -type f | wc -l)"
          cd "$out"
          git init -q -b onix-mojmap && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "Onix 1.21.1 sources with Mojang names"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/onix-mojmap
