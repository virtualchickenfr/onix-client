name: Build Onix Client

# Every push builds the mod and the installers (Actions → Artifacts).
# A release – which installed launchers find on their next start and install (launcher/lib/updater.js) – is made when
#   - a push to main raises "version" in launcher/package.json (for example 1.0.0 → 1.0.1), or
#   - Actions → Build Onix Client → Run workflow is started with a version, or
#   - a version tag is pushed (git tag v1.1.0 && git push origin v1.1.0).

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish this version as a release (for example 1.1.0). Leave empty for a test build.'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

# never run two builds of the same branch at once
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide version and whether to publish
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          pkg=$(node -p "require('./launcher/package.json').version")
          release=false
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"; release=true
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"; release=true
          else
            version="$pkg"
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              # publish when this version has no published release yet (a draft left by a failed run is retried)
              state=$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || echo missing)
              if [ "$state" != "false" ]; then release=true; fi
            fi
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::The version must look like 1.2.3 (got '$version')"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Version $version, release: $release"

  mod:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build mod
        working-directory: mod
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew build --no-daemon --stacktrace -Pmod_version="$VERSION" 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # show the compiler errors as annotations on the run page (readable without downloading the log)
            python3 ../.github/build_errors.py build.log
            exit "$status"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: onix-client-mod
          path: mod/build/libs/onix-client-*.jar

  # Onix for Minecraft 1.21.11 (official Mojang names, Loom 1.18)
  mod-1-21-11:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Build mod for 1.21.11
        working-directory: mod-1.21.11
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew build --no-daemon --stacktrace -Pmod_version="$VERSION" 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            python3 ../.github/build_errors.py build.log
            exit "$status"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: onix-client-mod-1.21.11
          path: mod-1.21.11/build/libs/onix-client-*.jar

  # Onix for further Minecraft versions, generated from mod-1.21.11 by tools/port.py (ports/<version>/port.json)
  mod-ports:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - { port: '1.21.10', java: 25 }
          - { port: '1.21.8', java: 25 }
          - { port: '1.21.7', java: 25 }
          - { port: '1.21.6', java: 25 }
          - { port: '1.21.4', java: 21 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Generate the port
        run: python3 tools/port.py ${{ matrix.port }}
      - name: Build mod for ${{ matrix.port }}
        working-directory: ports/build/mod-${{ matrix.port }}
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew build --no-daemon --stacktrace -Pmod_version="$VERSION" 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            python3 ../../../.github/build_errors.py build.log
            exit "$status"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: onix-client-mod-port-${{ matrix.port }}
          path: ports/build/mod-${{ matrix.port }}/build/libs/onix-client-*.jar

  # one draft release that the three installer builds upload into; it is published at the end,
  # so launchers never see a release with files missing
  prepare-release:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.plan.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null | grep -q false; then
            echo "::error::Release $TAG already exists – raise the version"; exit 1
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "Onix Client $TAG" --generate-notes

  launcher:
    needs: [plan, mod, mod-1-21-11, mod-ports, prepare-release]
    if: ${{ !cancelled() && needs.mod.result == 'success' && needs.mod-1-21-11.result == 'success' && needs.mod-ports.result == 'success' && needs.prepare-release.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: onix-client-mod
          path: mod/build/libs
      - uses: actions/download-artifact@v4
        with:
          name: onix-client-mod-1.21.11
          path: mod-1.21.11/build/libs
      - uses: actions/download-artifact@v4
        with:
          pattern: onix-client-mod-port-*
          path: ports/build/jars
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build installers
        working-directory: launcher
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
          RELEASE: ${{ needs.plan.outputs.release }}
          # with SignPath set up, the Windows installer is signed first and uploaded by the steps below
          SIGN: ${{ matrix.os == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          # the updater finds new versions in this repository's releases
          npm pkg set repository.type=git "repository.url=https://github.com/${GITHUB_REPOSITORY}.git"
          npm pkg set version="$VERSION"
          npm install
          if [ "$RELEASE" = "true" ] && [ "$SIGN" != "true" ]; then npm run release; else npm run dist; fi

      # ---- Windows code signing with SignPath (free for open source, see README → Code signing policy)
      - name: Upload the unsigned installer for signing
        id: unsigned
        if: matrix.os == 'windows-latest' && needs.plan.outputs.release == 'true' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: launcher/dist/*.exe
      - name: Sign the installer
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'onix-client' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: launcher/dist-signed
      - name: Add the signed installer to the release
        if: steps.unsigned.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          exe=$(ls launcher/dist-signed/*.exe | head -n 1)
          node .github/latest-yml.js "$exe" "$VERSION" launcher/dist-signed/latest.yml
          gh release upload "v$VERSION" "$exe" launcher/dist-signed/latest.yml --repo "$GITHUB_REPOSITORY" --clobber
          cp "$exe" launcher/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: onix-client-${{ matrix.os }}
          path: |
            launcher/dist/*.exe
            launcher/dist/*.dmg
            launcher/dist/*.AppImage

  # macOS runners can wait in GitHub's queue for a long time: the release does not wait for them,
  # the Mac files are added to it once they are built.
  launcher-mac:
    needs: [plan, mod, mod-1-21-11, mod-ports, prepare-release]
    if: ${{ !cancelled() && needs.mod.result == 'success' && needs.mod-1-21-11.result == 'success' && needs.mod-ports.result == 'success' && needs.prepare-release.result != 'failure' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: onix-client-mod
          path: mod/build/libs
      - uses: actions/download-artifact@v4
        with:
          name: onix-client-mod-1.21.11
          path: mod-1.21.11/build/libs
      - uses: actions/download-artifact@v4
        with:
          pattern: onix-client-mod-port-*
          path: ports/build/jars
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the Mac app and add it to the release
        working-directory: launcher
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
          RELEASE: ${{ needs.plan.outputs.release }}
        run: |
          npm pkg set repository.type=git "repository.url=https://github.com/${GITHUB_REPOSITORY}.git"
          npm pkg set version="$VERSION"
          npm install
          npm run dist
          if [ "$RELEASE" = "true" ]; then
            gh release upload "v$VERSION" dist/*.dmg dist/*.zip dist/*.blockmap dist/latest-mac.yml --repo "$GITHUB_REPOSITORY" --clobber
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: onix-client-macos-latest
          path: launcher/dist/*.dmg

  publish-release:
    needs: [plan, mod, mod-1-21-11, mod-ports, launcher]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: onix-client-mod
          path: mod
      - uses: actions/download-artifact@v4
        with:
          name: onix-client-mod-1.21.11
          path: mod
      - uses: actions/download-artifact@v4
        with:
          pattern: onix-client-mod-port-*
          path: mod
          merge-multiple: true
      - name: Add the mod jars and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.plan.outputs.version }}
        run: |
          gh release upload "$TAG" $(ls mod/onix-client-*.jar | grep -v -- -sources) --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
