name: Build Onix Client

# Every push builds the mod and the installers (Actions → Artifacts).
# A release – which installed launchers find on their next start and install (launcher/lib/updater.js) – is made by
#   - Actions → Build Onix Client → Run workflow → enter a version such as 1.1.0, or
#   - pushing a version tag (git tag v1.1.0 && git push origin v1.1.0).

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish this version as a release (for example 1.1.0). Leave empty for a test build.'
        required: false
        default: ''

permissions:
  contents: write

env:
  # empty for a normal build; the version (or "true" for a tag push) when this run publishes a release
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version }}
  TAG: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}

jobs:
  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build mod
        working-directory: mod
        shell: bash
        run: |
          chmod +x gradlew
          args="build --no-daemon --stacktrace"
          if [ -n "$RELEASE" ] && [ "$RELEASE" != "false" ]; then args="$args -Pmod_version=${TAG#v}"; fi
          set +e
          ./gradlew $args 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # show the compiler errors as annotations on the run page (readable without downloading the log)
            python3 ../.github/build_errors.py build.log
            exit "$status"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: onix-client-mod
          path: mod/build/libs/onix-client-*.jar

  # one draft release that the three installer builds upload into; it is published at the end,
  # so launchers never see a release with files missing
  prepare-release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! echo "${TAG#v}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::The version must look like 1.2.3 (got '${TAG#v}')"; exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null | grep -q false; then
            echo "::error::Release $TAG already exists – use a higher version"; exit 1
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "Onix Client $TAG" --generate-notes

  launcher:
    needs: [mod, prepare-release]
    if: ${{ !cancelled() && needs.mod.result == 'success' && needs.prepare-release.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: onix-client-mod
          path: mod/build/libs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build installers
        working-directory: launcher
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # the updater finds new versions in this repository's releases
          npm pkg set repository.type=git "repository.url=https://github.com/${GITHUB_REPOSITORY}.git"
          npm install
          if [ -n "$RELEASE" ] && [ "$RELEASE" != "false" ]; then
            npm pkg set version="${TAG#v}"
            npm run release
          else
            npm run dist
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: onix-client-${{ matrix.os }}
          path: |
            launcher/dist/*.exe
            launcher/dist/*.dmg
            launcher/dist/*.AppImage

  publish-release:
    needs: [mod, launcher]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: onix-client-mod
          path: mod
      - name: Add the mod jar and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" $(ls mod/onix-client-*.jar | grep -v -- -sources) --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
