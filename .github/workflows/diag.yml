name: Server diagnostics
on:
  push:
    paths: ['.github/diag-trigger']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for n in Virtualchickenfr Fuzed_d; do echo "::notice title=$n::$(curl -sS https://api.mojang.com/users/profiles/minecraft/$n)"; done
          sleep 50
          echo "::notice title=diag::$(curl -sS https://mconixclient.virtualchickenfr.workers.dev/v1/diag/mojang | head -c 1500)"
