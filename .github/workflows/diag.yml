name: Server diagnostics
on:
  push:
    paths: ['.github/diag-trigger']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS https://api.minecraftservices.com/publickeys > keys.json
          python3 -c "
          import json; d=json.load(open('keys.json'))
          for i,k in enumerate(d['playerCertificateKeys']): print('::notice title=pc%d::%s' % (i, k['publicKey']))
          print('::notice title=counts::%d %d' % (len(d['playerCertificateKeys']), len(d['profilePropertyKeys'])))
          "
