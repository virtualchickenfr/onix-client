# Cloudflare Worker for the Onix server. Cloudflare builds it from this folder on every push (Workers Builds:
# root directory server/cloudflare, deploy command "npx wrangler deploy"). The tables are created on the first request.
name = "mconixclient"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
VERIFY = "1"
UNLIMITED = "Virtualchickenfr,Fuzed_d"
# OWNER tag and violet badge for these accounts
OWNERS = "VirtualChickenFR"

[triggers]
crons = ["17 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "onix"
database_id = "2d635367-44d2-40e5-b063-1b6dd738bc19"
