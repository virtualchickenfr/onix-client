plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"

base {
	archivesName = 'onix-client'
}

loom {
	mods {
		"onix" {
			sourceSet sourceSets.main
		}
	}

	runs {
		// Automated screenshot walkthrough: gradlew runDevtest
		devtest {
			client()
			name = "Onix Dev Test"
			vmArg "-Donix.devtest=true"
			vmArg "-Dmixin.debug.countInjections=true"
			vmArg "-Dmixin.debug.verbose=false"
			programArgs "--width", "1280", "--height", "720"
			runDir "run"
		}
	}
}

// Minecraft runs on Java 21 (the build itself may use a newer JDK)
tasks.matching { it.name == 'runDevtest' || it.name == 'runClient' }.configureEach {
	javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
	it.options.compilerArgs += ['-Xmaxerrs', '2000']
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
